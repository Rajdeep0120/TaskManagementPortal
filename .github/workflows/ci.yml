name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-build-test:
    name: Backend (.NET 8) Build & Test
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup .NET 8
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore Backend Dependencies
      run: dotnet restore TaskManagementPortal.slnx

    - name: Build Backend (Release)
      run: dotnet build TaskManagementPortal.slnx --configuration Release --no-restore

    - name: Run xUnit Unit Tests
      run: dotnet test TaskManagement.Tests/TaskManagement.Tests.csproj --configuration Release --no-build --verbosity normal

  frontend-build:
    name: Frontend (React + TypeScript) Build
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: taskmanagement-ui/package-lock.json

    - name: Install Frontend Dependencies
      working-directory: ./taskmanagement-ui
      run: npm install --legacy-peer-deps

    - name: Type Check & Build
      working-directory: ./taskmanagement-ui
      run: npm run build

