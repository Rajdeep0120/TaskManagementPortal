services:
  postgres:
    image: postgres:16-alpine
    container_name: taskmanagement-db
    environment:
      POSTGRES_DB: taskmanagement_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - taskmanagement-net

  api:
    build:
      context: .
      dockerfile: TaskManagement.Api/Dockerfile
    container_name: taskmanagement-api
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=taskmanagement_db;Username=postgres;Password=postgres123
      - Jwt__Secret=YourSuperSecretKeyThatIsAtLeast32CharactersLong2024!
      - Jwt__Issuer=TaskManagement.Api
      - Jwt__Audience=TaskManagement.Client
    ports:
      - "5000:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - taskmanagement-net

  ui:
    build:
      context: ./taskmanagement-ui
      dockerfile: Dockerfile
    container_name: taskmanagement-ui
    ports:
      - "3000:80"
    depends_on:
      - api
    networks:
      - taskmanagement-net

volumes:
  pgdata:

networks:
  taskmanagement-net:
    driver: bridge
